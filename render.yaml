# Render Blueprint for Nena na Daktari Backend
# The PostgreSQL database is created manually on Render.
# This blueprint defines the web service only.

services:
  - type: web
    name: nnd-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements/prod.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: |
      cd backend
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      # Django core
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: nnd-backend.onrender.com
      - key: DJANGO_DEBUG
        value: false

      # Database — paste your Render PostgreSQL Internal Database URL here
      # Go to your database page → Connections → Internal Database URL
      - key: DATABASE_URL
        sync: false

      # CORS — your Vercel frontend URL (comma-separated if multiple)
      - key: CORS_ALLOWED_ORIGINS
        value: https://nena-na-daktari.vercel.app
